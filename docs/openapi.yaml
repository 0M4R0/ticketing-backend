openapi: 3.1.0
info:
  title: Event Ticketing API
  version: 1.0.0
  description: Version 1 of the event ticketing API.

servers:
  - url: /api/v1
    description: Current API host

tags:
  - name: Health
  - name: Authentication
  - name: Users

paths:
  /health:
    get:
      tags: [Health]
      summary: Check API health
      operationId: getHealth
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register an account
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/RegisteredUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already registered
        "429":
          description: Registration rate limit exceeded (5 attempts per 15 minutes).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Too many registration attempts, please try again later.

  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in and create a session
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful. The refresh token is set as an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Refresh cookie scoped to `/api/v1/auth`.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, user]
                properties:
                  accessToken:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Account is banned
        "429":
          description: Login rate limit exceeded (5 attempts per 15 minutes).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Too many login attempts, please try again later.

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate the refresh cookie
      operationId: refreshSession
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Refresh token rotated; a new refresh cookie is set.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Refresh rate limit exceeded (30 attempts per 15 minutes).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Too many refresh attempts, please try again later.

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the session and clear the refresh cookie
      operationId: logoutUser
      security:
        - refreshCookie: []
      responses:
        "204":
          description: Session revoked and refresh cookie cleared
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Logout rate limit exceeded (10 attempts per 15 minutes).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Too many logout attempts, please try again later.

  /users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile retrieved
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Users]
      summary: Update the authenticated user's name or phone
      operationId: updateMyProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/sessions:
    get:
      tags: [Users]
      summary: List the authenticated user's active sessions
      operationId: listMySessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active sessions retrieved
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Users]
      summary: Revoke all of the authenticated user's sessions
      operationId: revokeAllMySessions
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All sessions revoked, including the current session
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/sessions/{sessionId}:
    delete:
      tags: [Users]
      summary: Revoke one of the authenticated user's sessions
      operationId: revokeMySession
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Session not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token

  schemas:
    UserSession:
      type: object
      required:
        - id
        - ipAddress
        - userAgent
        - deviceName
        - createdAt
        - lastUsedAt
        - expiresAt
        - isCurrentDevice
      properties:
        id:
          type: string
          format: uuid
        ipAddress:
          type: [string, "null"]
        userAgent:
          type: [string, "null"]
        deviceName:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        expiresAt:
          type: string
          format: date-time
        isCurrentDevice:
          type: boolean
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Maximum 72 UTF-8 bytes.
        phone:
          type: string
          maxLength: 30

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72

    User:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    RegisteredUser:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email

    Profile:
      type: object
      required: [name, email, createdAt]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time

    UpdateProfileInput:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: [string, "null"]
          maxLength: 30

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Invalid request body or malformed JSON
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, revoked, or expired refresh cookie
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
